name: ci
on: [push, pull_request]

jobs:
  test:
    # engines says >=18, and until 2026-08-12 nothing ever ran it: this job pinned
    # Node 20. orogami declared the same floor, was broken on 18, on 20.18 and on
    # 22.0-22.6, and its single Node 20 job stayed green throughout. The break was
    # not monotonic, so one version cannot stand in for the others.
    #
    # This one matters more than its siblings: tenken is the only package here with
    # runtime dependencies (@hyuga/reflint, skills-lint, carrylint), so a version
    # break can arrive from a dependency it did not change.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18.x', '20.x', '22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: node --test

  dogfood:
    # tenken checks its own agent config with the same three engines it ships.
    # examples/bad is excluded on purpose — it is meant to fail.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --omit=dev --no-audit --no-fund
      - name: tenken self-check
        run: node src/check.mjs AGENTS.md examples/good
